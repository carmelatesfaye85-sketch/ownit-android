name: Build OwnIt app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk OwnIt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OwnIt-app
          path: OwnIt.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OwnIt for Android (build ${{ github.run_number }})
          body: |
            Download **OwnIt.apk** below and open it on your Android phone.
            Setup steps are in the README.
          files: OwnIt.apk
          make_latest: true
